<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estoque">
<title>Estoque · Dieta</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<style>
:root{
  --bg:#0f1012; --card:#191a1e; --card2:#212329; --line:#2b2d33;
  --tx:#f2f2f4; --tx2:#a0a2ab; --tx3:#6e7079;
  --ok:#40c463; --warn:#e8b339; --crit:#f0553f; --accent:#4c8dff;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--tx);
  padding:0 0 100px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

header{padding:calc(env(safe-area-inset-top) + 18px) 0 12px;background:var(--bg);
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)}
.htop{display:flex;justify-content:space-between;align-items:flex-start}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--tx3);font-weight:600}
.sub{font-size:12px;color:var(--tx3);margin-top:5px}
.gear{background:var(--card2);border:none;color:var(--tx2);width:34px;height:34px;
  border-radius:9px;font-size:16px;cursor:pointer}
.alerts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:100px;background:var(--card2);color:var(--tx2)}
.pill.c{background:rgba(240,85,63,.16);color:var(--crit)}
.pill.w{background:rgba(232,179,57,.16);color:var(--warn)}
.pill.o{background:rgba(64,196,99,.14);color:var(--ok)}

.syncbar{display:flex;align-items:center;gap:8px;margin-top:11px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;color:var(--tx2)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex-shrink:0}
.sdot.ok{background:var(--ok)} .sdot.busy{background:var(--accent)}
.sdot.warn{background:var(--warn)} .sdot.err{background:var(--crit)}
#stxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slink{background:var(--accent);border:none;color:#fff;font-size:11.5px;font-weight:700;
  padding:6px 12px;border-radius:8px;cursor:pointer;font-family:var(--sans);flex-shrink:0;display:none}

.dayrow{display:flex;gap:8px;margin:14px 0 4px}
.daybtn{flex:1;background:var(--accent);color:#fff;border:none;border-radius:12px;
  padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.daybtn:active{opacity:.75}
.undo{background:var(--card2);color:var(--tx2);border:none;border-radius:12px;
  padding:14px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.undo:disabled{opacity:.35}

.item{background:var(--card);border-radius:13px;margin-bottom:9px;overflow:hidden}
.ihead{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer}
.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.iname{flex:1;min-width:0}
.mtag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  background:var(--card2);color:var(--tx3);padding:2px 6px;border-radius:100px;margin-left:6px;vertical-align:2px}
.iname .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iname .q{font-size:12.5px;color:var(--tx2);margin-top:2px;font-variant-numeric:tabular-nums}
.days{text-align:right;flex-shrink:0}
.days .v{font-size:20px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.days .l{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:700}
.bar{height:3px;background:var(--line)}
.bar div{height:100%;transition:width .25s}

.acts{display:none;padding:0 14px 14px;border-top:1px solid var(--line);padding-top:12px}
.item.open .acts{display:block}
.qrow{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.qbtn{flex:1;min-width:74px;background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:9px 6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.qbtn:active{background:var(--line)}
.qbtn.buy{border-color:rgba(64,196,99,.4);color:var(--ok)}
.qbtn.use{border-color:rgba(240,85,63,.35);color:var(--crit)}
.inrow{display:flex;gap:7px;align-items:center}
.inrow input{flex:1;background:var(--bg);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:11px;font-size:15px;font-family:var(--sans);min-width:0}
.inrow input:focus{outline:none;border-color:var(--accent)}
.mini{font-size:11px;color:var(--tx3);margin-top:9px;line-height:1.45}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;
  padding:20px 16px calc(env(safe-area-inset-bottom) + 22px);max-height:86vh;overflow-y:auto}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet p.d{font-size:12.5px;color:var(--tx3);margin-bottom:16px}
.sheet h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--tx3);margin:22px 0 8px}
.cfg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cfg .cn{flex:1;font-size:14px}
.cfg .cu{font-size:11px;color:var(--tx3)}
.cfg input{width:82px;background:var(--bg);border:1px solid var(--line);color:var(--tx);
  border-radius:8px;padding:8px;font-size:14px;text-align:right;font-family:var(--sans)}
.gbtn{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--line);
  border-radius:11px;padding:13px;font-size:14px;font-weight:600;margin-top:8px;
  cursor:pointer;font-family:var(--sans)}
.close{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;
  padding:14px;font-size:15px;font-weight:700;margin-top:18px;cursor:pointer;font-family:var(--sans)}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:50%;
  transform:translateX(-50%) translateY(90px);background:var(--card2);color:var(--tx);
  padding:12px 20px;border-radius:100px;font-size:13.5px;font-weight:600;z-index:60;
  transition:transform .25s;border:1px solid var(--line);max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="htop">
      <div>
        <h1>Estoque <span>· dieta</span></h1>
        <div class="sub" id="sub"></div>
      </div>
      <button class="gear" id="gear">&#9881;</button>
    </div>
    <div class="alerts" id="alerts"></div>
    <div class="syncbar">
      <span class="sdot" id="sdot"></span>
      <span id="stxt">Iniciando&hellip;</span>
      <button class="slink" id="sbtn">Entrar</button>
    </div>
  </header>

  <div class="dayrow">
    <button class="daybtn" id="dayBtn">Registrar consumo do dia</button>
    <button class="undo" id="undoBtn" disabled>Desfazer</button>
  </div>

  <div id="list"></div>

  <p class="mini" style="margin-top:22px;text-align:center">
    Os dados ficam no aparelho e sincronizam com sua planilha privada do Google.
  </p>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h2>Consumo diário</h2>
    <p class="d">Quanto a dieta prevê por dia. É a base do cálculo de dias restantes.</p>
    <div id="cfgList"></div>
    <div class="cfg" style="margin-top:14px;border:none">
      <div class="cn">Alertar com menos de<div class="cu">dias restantes</div></div>
      <input type="number" id="alertDays" min="1" step="1">
    </div>

    <h3>Google Sheets</h3>
    <button class="gbtn" id="bPush">Salvar na nuvem agora</button>
    <button class="gbtn" id="bPull">Puxar da nuvem (descarta local)</button>
    <button class="gbtn" id="bSignin">Entrar com Google</button>
    <button class="gbtn" id="bSignout">Sair da conta Google</button>

    <button class="close" id="closeModal">Pronto</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async></script>
<script>
"use strict";

/* ============================================================
   CONFIGURAÇÃO — troque os dois valores abaixo pelos seus
   ============================================================ */
const CLIENT_ID = "159007664242-qn35k6nvj2rnksp1itej00bn6osr41vn.apps.googleusercontent.com";
const SHEET_ID  = "1hHtCeQXNaPlzeEFGY7CFcJPhyifshAn-CNSfWlszSjI";
const SHEET_TAB = "Estoque";
const SCOPE     = "https://www.googleapis.com/auth/spreadsheets";
/* ============================================================ */

const CONFIGURED = !CLIENT_ID.includes("COLE_AQUI") && !SHEET_ID.includes("COLE_AQUI");
const KEY = "estoque-dieta-v2";

const CAT={
  "Proteína":"#e0574a","Laticínios":"#e8c04a","Suplementos":"#a98cd8",
  "Frutas":"#5cbf6a","Carbo/Caloria":"#e8894a"
};
const SEED=[
  {id:"ovos",     n:"Ovos",                   c:"Proteína",      u:"un", d:2,     e:0, auto:true},
  {id:"frangocru",n:"Frango cru congelado",   c:"Proteína",      u:"g",  d:92.31, e:0, auto:false},
  {id:"frango",   n:"Frango desfiado pronto", c:"Proteína",      u:"g",  d:60,    e:0, auto:true},
  {id:"sardinha", n:"Sardinha (drenada)",     c:"Proteína",      u:"g",  d:21,    e:0, auto:true},
  {id:"leite",    n:"Leite desnatado",        c:"Laticínios",    u:"ml", d:400,   e:0, auto:true},
  {id:"leitepo",  n:"Leite em pó integral",   c:"Laticínios",    u:"g",  d:30,    e:0, auto:true},
  {id:"requeijao",n:"Requeijão light",        c:"Laticínios",    u:"g",  d:20,    e:0, auto:true},
  {id:"cottage",  n:"Cottage",                c:"Laticínios",    u:"g",  d:30,    e:0, auto:true},
  {id:"whey",     n:"Whey concentrado",       c:"Suplementos",   u:"g",  d:30,    e:0, auto:true},
  {id:"banana",   n:"Banana nanica",          c:"Frutas",        u:"un", d:3,     e:0, auto:true},
  {id:"kiwi",     n:"Kiwi",                   c:"Frutas",        u:"un", d:2,     e:0, auto:true},
  {id:"pao",      n:"Pão de forma integral",  c:"Carbo/Caloria", u:"g",  d:50,    e:0, auto:true},
  {id:"aveia",    n:"Aveia em flocos finos",  c:"Carbo/Caloria", u:"g",  d:100,   e:0, auto:true},
  {id:"pasta",    n:"Pasta de amendoim",      c:"Carbo/Caloria", u:"g",  d:30,    e:0, auto:true},
  {id:"azeite",   n:"Azeite extra virgem",    c:"Carbo/Caloria", u:"g",  d:18.32, e:0, auto:true}
];

let S=load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r && r.items){
      SEED.forEach(s=>{ if(!r.items.find(i=>i.id===s.id)) r.items.push(Object.assign({},s)); });
      r.items.forEach(i=>{
        const s=SEED.find(x=>x.id===i.id); if(!s) return;
        if(i.auto===undefined) i.auto=s.auto;
        if(i.u!==s.u){ i.u=s.u; i.d=s.d; i.e=0; }
      });
      return r;
    }
  }catch(e){}
  return {items:SEED.map(s=>Object.assign({},s)), alertDays:5, last:null};
}
function save(cloud){
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(cloud!==false) schedulePush();
}

function fmt(v,u){
  if(u==="un") return (Math.round(v*10)/10).toString().replace(".",",")+" un";
  if(v>=1000) return (Math.round(v/100)/10).toString().replace(".",",")+" "+(u==="ml"?"L":"kg");
  const r=Math.round(v*100)/100;
  return (Number.isInteger(r)?r:r.toString().replace(".",","))+" "+u;
}
function daysLeft(i){ return i.d>0 ? i.e/i.d : Infinity; }
function colorFor(n){ return n<3?"var(--crit)" : n<S.alertDays?"var(--warn)" : "var(--ok)"; }

function render(){
  const items=S.items.slice().sort(function(a,b){return daysLeft(a)-daysLeft(b);});
  const crit=items.filter(function(i){return daysLeft(i)<3;}).length;
  const warn=items.filter(function(i){return daysLeft(i)>=3 && daysLeft(i)<S.alertDays;}).length;
  const ok=items.length-crit-warn;

  document.getElementById("sub").textContent=
    new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"short"});

  document.getElementById("alerts").innerHTML=
    (crit?'<span class="pill c">'+crit+' acabando</span>':"")+
    (warn?'<span class="pill w">'+warn+' repor em breve</span>':"")+
    (ok?'<span class="pill o">'+ok+' ok</span>':"");

  document.getElementById("list").innerHTML=items.map(function(i){
    const n=daysLeft(i), col=colorFor(n);
    const pct=Math.max(0,Math.min(100,(n/15)*100));
    const dtxt=!isFinite(n)?"&infin;":(n>=10?Math.floor(n):(Math.round(n*10)/10).toString().replace(".",","));
    const step=i.u==="un"?1:(i.d>=100?100:10);
    return '<div class="item" data-id="'+i.id+'">'+
      '<div class="ihead" onclick="tog(\''+i.id+'\')">'+
        '<span class="dot" style="background:'+CAT[i.c]+'"></span>'+
        '<div class="iname">'+
          '<div class="n">'+i.n+'</div>'+
          '<div class="q">'+fmt(i.e,i.u)+" &middot; "+fmt(i.d,i.u)+'/dia</div>'+
        '</div>'+
        '<div class="days"><div class="v" style="color:'+col+'">'+dtxt+'</div><div class="l">dias</div></div>'+
      '</div>'+
      '<div class="bar"><div style="width:'+pct+'%;background:'+col+'"></div></div>'+
      '<div class="acts">'+
        '<div class="qrow">'+
          '<button class="qbtn use" onclick="mv(\''+i.id+'\',-'+i.d+')">&minus; 1 dia</button>'+
          '<button class="qbtn use" onclick="mv(\''+i.id+'\',-'+step+')">&minus; '+fmt(step,i.u)+'</button>'+
          '<button class="qbtn buy" onclick="mv(\''+i.id+'\','+step+')">+ '+fmt(step,i.u)+'</button>'+
        '</div>'+
        '<div class="inrow">'+
          '<input type="number" inputmode="decimal" id="in-'+i.id+'" placeholder="quantidade em '+i.u+'">'+
          '<button class="qbtn buy" style="flex:0 0 88px" onclick="man(\''+i.id+'\',1)">Comprei</button>'+
          '<button class="qbtn use" style="flex:0 0 78px" onclick="man(\''+i.id+'\',-1)">Gastei</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join("");
}

function tog(id){
  const el=document.querySelector('.item[data-id="'+id+'"]');
  const all=document.querySelectorAll(".item");
  for(let k=0;k<all.length;k++){ if(all[k]!==el) all[k].classList.remove("open"); }
  el.classList.toggle("open");
}
function mv(id,delta){
  const it=S.items.find(function(i){return i.id===id;}); if(!it) return;
  it.e=Math.max(0,Math.round((it.e+delta)*100)/100);
  S.last=null; save(); render();
  const el=document.querySelector('.item[data-id="'+id+'"]'); if(el) el.classList.add("open");
  toast(it.n+": "+fmt(it.e,it.u));
}
function man(id,sign){
  const inp=document.getElementById("in-"+id);
  const v=parseFloat((inp.value||"").replace(",","."));
  if(!v||v<=0){ toast("Informe a quantidade"); return; }
  inp.value=""; inp.blur(); mv(id,sign*v);
}
document.getElementById("dayBtn").onclick=function(){
  S.items.forEach(function(i){ if(i.auto!==false) i.e=Math.max(0,Math.round((i.e-i.d)*100)/100); });
  S.last=Date.now(); save(); render();
  document.getElementById("undoBtn").disabled=false;
  toast("Dia registrado");
};
document.getElementById("undoBtn").onclick=function(){
  if(!S.last) return;
  S.items.forEach(function(i){ if(i.auto!==false) i.e=Math.round((i.e+i.d)*100)/100; });
  S.last=null; save(); render();
  document.getElementById("undoBtn").disabled=true;
  toast("Desfeito");
};

const modal=document.getElementById("modal");
document.getElementById("gear").onclick=function(){
  document.getElementById("cfgList").innerHTML=S.items.map(function(i){
    return '<div class="cfg">'+
      '<div class="cn">'+i.n+'<div class="cu">por dia &middot; '+i.u+'</div></div>'+
      '<input type="number" step="0.01" value="'+i.d+'" onchange="setD(\''+i.id+'\',this.value)">'+
    '</div>';
  }).join("");
  document.getElementById("alertDays").value=S.alertDays;
  modal.classList.add("on");
};
function setD(id,v){
  const it=S.items.find(function(i){return i.id===id;});
  const n=parseFloat(String(v).replace(",","."));
  if(it && !isNaN(n) && n>=0){ it.d=n; save(); }
}
document.getElementById("alertDays").onchange=function(e){
  const n=parseInt(e.target.value,10); if(n>0){ S.alertDays=n; save(); }
};
document.getElementById("closeModal").onclick=function(){ modal.classList.remove("on"); render(); };
modal.onclick=function(e){ if(e.target===modal){ modal.classList.remove("on"); render(); } };

let tt;
function toast(m){
  const t=document.getElementById("toast");
  t.textContent=m; t.classList.add("on");
  clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("on"); },1900);
}

/* ============================================================
   GOOGLE — login + sincronização com a planilha privada
   ============================================================ */
let tokenClient=null, accessToken=null, tokenExpiry=0;
let tokenResolve=null, tokenReject=null, autoSynced=false, pushTimer=null;

function setSync(kind,msg,showBtn,label){
  document.getElementById("sdot").className="sdot "+(kind||"");
  document.getElementById("stxt").textContent=msg;
  const b=document.getElementById("sbtn");
  b.style.display=showBtn?"block":"none";
  if(label) b.textContent=label;
}
function saveTok(){ try{ sessionStorage.setItem("est-tok",JSON.stringify({t:accessToken,e:tokenExpiry})); }catch(e){} }
function loadTok(){
  try{ const r=JSON.parse(sessionStorage.getItem("est-tok"));
    if(r&&r.t&&r.e&&Date.now()<r.e-60000){ accessToken=r.t; tokenExpiry=r.e; return true; } }catch(e){}
  return false;
}
function clearTok(){ accessToken=null; tokenExpiry=0; try{ sessionStorage.removeItem("est-tok"); }catch(e){} }

function whenGoogleReady(cb){
  if(window.google && google.accounts && google.accounts.oauth2){ cb(true); return; }
  let n=0;
  const t=setInterval(function(){
    if(window.google && google.accounts && google.accounts.oauth2){ clearInterval(t); cb(true); }
    else if(++n>60){ clearInterval(t); cb(false); }
  },250);
}
function initGoogle(){
  if(!CONFIGURED){ setSync("warn","Configuração do Google pendente (edite o index.html)"); return; }
  loadTok();
  whenGoogleReady(function(ok){
    if(!ok){ setSync("err","Script do Google não carregou",true,"Tentar"); return; }
    try{
      tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID, scope:SCOPE,
        callback:function(resp){ const f=tokenResolve; tokenResolve=tokenReject=null; if(f) f(resp); },
        error_callback:function(err){ const f=tokenReject; tokenResolve=tokenReject=null; if(f) f(err); }
      });
    }catch(e){ setSync("err","Falha ao iniciar o Google",true,"Tentar"); return; }
    getToken(false).then(function(tok){
      if(tok) startupSync();
      else setSync("warn","Toque em Entrar para sincronizar",true,"Entrar");
    }).catch(function(){ setSync("warn","Toque em Entrar para sincronizar",true,"Entrar"); });
  });
}
function getToken(interactive){
  return new Promise(function(resolve,reject){
    if(accessToken && Date.now()<tokenExpiry-60000){ resolve(accessToken); return; }
    if(!tokenClient){ if(interactive) reject(new Error("Google não inicializou")); else resolve(null); return; }
    tokenResolve=function(resp){
      if(resp && resp.error){ if(!interactive) resolve(null); else reject(resp); return; }
      accessToken=resp.access_token;
      tokenExpiry=Date.now()+((resp.expires_in?resp.expires_in:3600)*1000);
      saveTok(); resolve(accessToken);
    };
    tokenReject=function(err){ if(!interactive) resolve(null); else reject(err); };
    try{ tokenClient.requestAccessToken({prompt: interactive?"":"none"}); }
    catch(e){ tokenResolve=tokenReject=null; if(!interactive) resolve(null); else reject(e); }
  });
}
async function api(path,opts){
  const tok=await getToken(true);
  const base="https://sheets.googleapis.com/v4/spreadsheets/";
  const mk=function(t){ return Object.assign({headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"}},opts); };
  let r=await fetch(base+path,mk(tok));
  if(r.status===401){ clearTok(); const t2=await getToken(true); r=await fetch(base+path,mk(t2)); }
  return r;
}
async function ensureTab(){
  const r=await api(SHEET_ID+"?fields=sheets.properties.title");
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  const has=(j.sheets||[]).some(function(s){ return s.properties && s.properties.title===SHEET_TAB; });
  if(!has){
    await api(SHEET_ID+":batchUpdate",{method:"POST",
      body:JSON.stringify({requests:[{addSheet:{properties:{title:SHEET_TAB}}}]})});
  }
}
function stateToRows(){
  const rows=[
    ["alerta_dias", S.alertDays, "atualizado_em", new Date().toISOString()],
    [],
    ["id","item","unidade","consumo_dia","estoque"]
  ];
  for(let k=0;k<S.items.length;k++){
    const i=S.items[k];
    rows.push([i.id, i.n, i.u, i.d, i.e]);
  }
  return rows;
}
function rowsToState(values){
  if(!values || !values.length || (values[0][0]||"")!=="alerta_dias") return null;
  const alertDays = Number(values[0][1])>0 ? Number(values[0][1]) : 5;
  let start=-1;
  for(let i=0;i<values.length;i++){ if((values[i][0]||"")==="id"){ start=i+1; break; } }
  if(start<0) return null;
  const items=SEED.map(function(s){ return Object.assign({},s); });
  for(let i=start;i<values.length;i++){
    const r=values[i]; if(!r || !r[0]) continue;
    const it=items.find(function(x){ return x.id===String(r[0]).trim(); }); if(!it) continue;
    const d=Number(String(r[3]).replace(",",".")); if(!isNaN(d)&&d>=0) it.d=d;
    const e=Number(String(r[4]).replace(",",".")); if(!isNaN(e)&&e>=0) it.e=e;
  }
  return {items:items, alertDays:alertDays, last:null};
}
async function cloudPull(){
  await ensureTab();
  const r=await api(SHEET_ID+"/values/"+encodeURIComponent(SHEET_TAB+"!A1:E200"));
  if(!r.ok) throw new Error("HTTP "+r.status);
  const data=await r.json();
  return rowsToState(data.values);
}
async function cloudPush(){
  await ensureTab();
  await api(SHEET_ID+"/values/"+encodeURIComponent(SHEET_TAB+"!A1:E200")+":clear",{method:"POST",body:"{}"});
  const r=await api(SHEET_ID+"/values/"+encodeURIComponent(SHEET_TAB+"!A1")+"?valueInputOption=RAW",
    {method:"PUT",body:JSON.stringify({values:stateToRows()})});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
async function startupSync(){
  if(autoSynced) return; autoSynced=true;
  setSync("busy","Sincronizando…");
  try{
    const cloud=await cloudPull();
    if(cloud===null){ await cloudPush(); }
    else { S=cloud; save(false); render(); }
    setSync("ok","Sincronizado com Google Sheets");
  }catch(e){ setSync("err","Falha ao sincronizar — toque para tentar",true,"Tentar"); }
}
function schedulePush(){
  if(!CONFIGURED || !accessToken) return;
  clearTimeout(pushTimer);
  setSync("busy","Salvando…");
  pushTimer=setTimeout(function(){ pushNow(true); },1500);
}
async function pushNow(silent){
  if(!CONFIGURED){ setSync("warn","Configuração do Google pendente"); return; }
  setSync("busy","Salvando na nuvem…");
  try{
    await cloudPush();
    setSync("ok","Sincronizado com Google Sheets");
    if(!silent) toast("Salvo na planilha");
  }catch(e){ setSync("err","Salvo no aparelho, falhou na nuvem — toque para tentar",true,"Tentar"); }
}
document.getElementById("sbtn").onclick=async function(){
  try{
    setSync("busy","Conectando…");
    await getToken(true);
    autoSynced=false;
    await startupSync();
  }catch(e){ setSync("err","Não foi possível entrar",true,"Entrar"); }
};
document.getElementById("bSignin").onclick=function(){
  modal.classList.remove("on"); document.getElementById("sbtn").onclick();
};
document.getElementById("bPush").onclick=function(){ modal.classList.remove("on"); pushNow(false); };
document.getElementById("bPull").onclick=async function(){
  modal.classList.remove("on");
  setSync("busy","Puxando da nuvem…");
  try{
    const cloud=await cloudPull();
    if(cloud===null){ toast("A planilha ainda está vazia"); setSync("ok","Sincronizado com Google Sheets"); return; }
    S=cloud; save(false); render(); toast("Dados da planilha carregados");
    setSync("ok","Sincronizado com Google Sheets");
  }catch(e){ setSync("err","Falha ao puxar — toque para tentar",true,"Tentar"); }
};
document.getElementById("bSignout").onclick=function(){
  try{
    if(accessToken && window.google && google.accounts && google.accounts.oauth2)
      google.accounts.oauth2.revoke(accessToken,function(){});
  }catch(e){}
  clearTok(); autoSynced=false; modal.classList.remove("on");
  setSync("warn","Desconectado — toque em Entrar",true,"Entrar");
  toast("Sessão encerrada");
};

render();
if(S.last) document.getElementById("undoBtn").disabled=false;
initGoogle();

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("./sw.js").catch(function(){}); });
}
</script>
